id = "orchestrator"
name = "Orchestrator"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Parent workspace spawns child worktree agents and watches them: bulk-spawn a squad from tasks.json, then open a live board."
platforms = ["macos", "linux"]

[[build]]
command = ["bun", "install", "--frozen-lockfile"]

[[actions]]
id = "spawn"
title = "Spawn squad"
command = ["bun", "src/spawn.ts"]

[[panes]]
id = "board"
title = "Orchestrator board"
placement = "overlay"
command = ["bun", "src/board.ts"]
